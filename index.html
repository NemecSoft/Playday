<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playday</title>
    <style>
      /* 最小可见 boot 屏——白屏时能区分"HTML 没加载"还是"JS 没执行"。 */
      #boot {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; align-items: center; justify-content: center;
        background: #171a1f; color: #9aa4b2; font: 14px sans-serif;
      }
      #boot.hidden { display: none; }
    </style>
    <script>
      // 启动期的 JS 错误显示在 boot 屏 + 标题上，方便排查。
      window.__bootErr = null;
      window.addEventListener('error', function (e) {
        window.__bootErr = (e.error && e.error.message) || e.message || 'error';
        var el = document.getElementById('boot');
        if (el) { el.textContent = 'JS ERROR: ' + window.__bootErr; }
        document.title = 'ERR: ' + window.__bootErr;
      });
      window.addEventListener('unhandledrejection', function (e) {
        window.__bootErr = 'rejection: ' + ((e.reason && e.reason.message) || e.reason);
        var el = document.getElementById('boot');
        if (el) { el.textContent = 'JS REJECTION: ' + window.__bootErr; }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">Playday 加载中...</div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
