<!DOCTYPE html>
<!-- generated by scripts/detail-pages/shell.html —— 详情页的骨架，服务器往里填三处占位符：
     TITLE / DESC / DATA（DATA = window.__GAME__ 的 JSON 字面量）。
     ⚠️ 这里**故意不写占位符的字面量**（就是带双花括号那种）：服务器替换的是"第一处命中"，
        写在注释里会把真正的那个挡掉 —— 2026-09-18 实测：页面里 window.__GAME__ 拿到的是
        占位符本身，详情页整片空白。（两端已改成全局替换，但别再写回来。）
     版面、选项卡、主图选择都在 ../_shared/detail.js 里做（客户端渲染，见那个文件头部注释）。
     ⚠️ .container 必须留着：服务器的主题注入与「游戏视频」区块注入都往这里落。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="stylesheet" href="../_shared/detail.css">
<!-- 截图灯箱（PhotoSwipe）的样式。脚本按需动态 import，见 detail.js 的「截图点击放大」段。 -->
<link rel="stylesheet" href="../_shared/vendor/photoswipe.css">
<!-- 截图轮播（Splide，成熟轮播库）的样式。脚本按需注入，见 detail.js 的「截图轮播」段。 -->
<link rel="stylesheet" href="../_shared/vendor/splide.min.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <span>🎮 游戏库 · <a href="../index.html">返回全部游戏</a></span>
    <span>{{TITLE}}</span>
  </div>
</div>

<div class="container">
  <div id="dp-root"></div>
  <!-- 服务器注入的 #yungame-videos 会追加到这个 .container 末尾（既有机制），detail.js 再把它搬进「游戏视频」面板 -->
</div>

<script>window.__GAME__ = {{DATA}};</script>
<script src="../_shared/detail.js"></script>

</body>
</html>
