# 打包配置：把 Playday 打成"免安装便携版"（绿色版）。
# 产物形态：release/win-unpacked/ 下一个文件夹，里面是
#   PlayniteUI.exe（客户端）
#   以及运行所需的 electron 运行时、资源、node_modules 依赖。
# data 目录（游戏库数据库 + CoverImages 封面图）是"绿色存储"，由用户放到 exe 同级，
# 因为主进程 configRoot() 在生产环境就用 exe 所在目录，data 放 exe 同级即可被找到。

appId: com.playday.app
productName: Playday
# 主进程编译产物入口在 package.json 的 main 字段（dist-electron/electron/main.js）

# 打包后 exe 文件名（配合 build.config.ts 的 CLIENT_EXE_NAME）
# 必须是 PlayniteUI：YunGameStart 建的桌面快捷方式目标就是 <游戏根>\PlayniteUI.exe
win:
  executableName: PlayniteUI
  # exe 文件自身的图标（替换 Electron 默认图标）
  # ⚠️ 用 .ico 而不是 .png：exe 里要嵌的是**多尺寸**图标（16 任务栏 / 32 桌面 / 256 大图标），
  #    给 PNG 的话 builder 得自己转，尺寸档由它决定；直接给 .ico 则用的是我们出好的那套。
  #    出图：public/icons/render-icon.cjs（矢量源 icon.svg），见 docs/design/app-icons.md
  icon: public/icons/icon.ico

# 只打免安装目录，不打安装包（用户要"拷走就能跑"，用 --dir 时该 target 生效）
# 产物先落在 <output>/win-unpacked/，再由 package.bat 分发到真正的发布目录：
#   release_test\   预发布（D 盘 config.json，不随包带数据）
#   release\        正式（X 盘 config.json + 随包 data/，直接拷去生产机的那份）
# 这里 output 只是**中转**：它不区分变体（变体由 package.bat 的 robocopy 目标决定），
# 打完 package.bat 会整个删掉它 —— 别把需要保留的东西放进这个目录。
# 注：别试图用命令行 -c.directories.output 覆盖它，electron-builder 25 会把 "-c.xxx"
#     当成配置文件路径，报 ENOENT: 打不开 .directories.output=xxx。
directories:
  output: .pack-tmp
  buildResources: build

files:
  - dist/**          # 渲染进程产物（vite build 输出）
  - dist-electron/** # 主进程编译产物（tsc 输出）
  - package.json

# 说明：sql.js 在 package.json 的 dependencies 里，electron-builder 会自动把
# 生产依赖的 node_modules（含 sql.js 的 .wasm 文件）一起打进 app.asar，
# 主进程 locateFile 会从 app.asar 内读取，无需额外处理。

# 不打包进 asar 的额外资源：把图标放一份到 resources/ 下，
# 打包后从 process.resourcesPath 读（路径稳定，比读 asar 内的更保险）。
extraResources:
  # 窗口/任务栏/托盘的应用图标**按等级在运行期切换**：黄金版 1.ico、钻石版 2.ico
  #（2026-09-16 需求）。它们同时也是 YunGameStart 建桌面快捷方式用的那两个图标 ——
  # 源文件只有一处（tools/yungamestart/assets/，由 make-icons.mjs 生成），
  # 随包发到 resources/ 下供客户端读取，另一份在 yungamestart/ 下供快捷方式工具用。
  # 见 docs/design/app-icons.md。
  - from: tools/yungamestart/assets/1.ico
    to: 1.ico
  - from: tools/yungamestart/assets/2.ico
    to: 2.ico
  # 通用系统图标 / 托盘图标：exe 自身图标（win.icon 是 icon.ico）与兜底用
  - from: public/icons/tray.ico
    to: tray.ico
  - from: public/icons/tray.png
    to: tray.png
  - from: public/icons/icon.ico
    to: icon.ico
  - from: public/icons/icon.png
    to: icon.png
  # 应用自带字体：整目录带到 resources/fonts，打包版不依赖用户机器上装了什么字体。
  # 查找顺序见 electron/core/fonts.ts：优先 <exe 同级>/fonts（运维可直接替换），
  # 找不到才用这份 resources/fonts。
  - from: fonts
    to: fonts
    filter:
      - "**/*.ttf"
      - "**/*.otf"
      - "**/*.ttc"
  # 随包第三方前端资源：整目录带到 resources/vendor，打包版由本地服务器按
  # /vendor/<文件名> 发给详情页（内置播放器 DPlayer，见 vendor/README.md）。
  - from: vendor
    to: vendor
  # 注：运行库安装包（VC++ x64/x86、VP9 解码扩展）**不在这里** —— 它由 package.bat
  # 复制成 <包>\runtime\（与 yungamestart\ 同一套"exe 同级目录"布局），正好就是
  # config.json 的 settings.runtimeDir 指的是那个路径。放这里是另一份 45 MB 的重复
  # （resources\runtime\ 与 <exe 同级>\runtime\ 各一份），不值得。见 runtime-deps.md。

# 禁止 electron-builder 自动下载/打包我们不需要的东西
npmRebuild: false

# 不自动上传/发布
publish: null
