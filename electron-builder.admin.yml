# 打包配置：管理端 Playday.Admin.exe（免安装便携版）。
# 与客户端 electron-builder.yml 共用同一套主进程代码（dist-electron），
# 但前端加载独立的 dist-admin（管理端 UI）。
# 主进程靠"当前 exe 文件名 == Playday.Admin"判断走管理端模式，无需 --admin 参数。

appId: com.playday.admin
productName: PlaydayAdmin
win:
  executableName: Playday.Admin
  icon: public/icons/icon.png

# 输出到独立目录，避免覆盖客户端的 win-unpacked
directories:
  output: release/admin
  buildResources: build

files:
  - dist-admin/**      # 管理端渲染产物（vite build:admin 输出）
  - dist-electron/**   # 主进程编译产物（与客户端共用）
  - package.json

extraResources:
  - from: public/icons/tray.png
    to: tray.png
  - from: public/icons/icon.png
    to: icon.png

npmRebuild: false
publish: null
